<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkBuddy 账号选择</title>
<style nonce="__NONCE__">
:root{color-scheme:dark;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#080e18;color:#dcece6}body{margin:0;padding:36px 20px}main{max-width:620px;margin:auto}h1{font-size:25px;margin:0}header{display:flex;gap:15px;align-items:center;justify-content:space-between;margin-bottom:20px}.muted{color:#89a498;font-size:14px}button{font:inherit;cursor:pointer;color:inherit;background:#10231f;border:1px solid #265b49;border-radius:10px;padding:9px 14px}button:hover{border-color:#00d681}button:disabled{opacity:.5;cursor:default}.card{background:#0b1520;border:1px solid #1c493b;border-radius:18px;padding:22px;margin-top:16px}.row{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;margin-top:10px;padding:14px;background:transparent;border-color:#203a33}.row.selected{background:#10372b;border-color:#00d681}.name{font-weight:600}.balance{font-size:20px;font-weight:700}.state{display:block;font-size:13px;color:#8fa89f}.selected .state{color:#00e59a}.error{color:#ff9292;min-height:26px}footer{margin-top:20px;color:#8fa89f;font-size:14px}.pill{display:inline-block;background:#15382e;border-radius:8px;padding:3px 9px;color:#72e6b5;font-size:13px}#status{margin-bottom:10px}.auto{display:block;width:100%;text-align:left}.bottom{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:18px}a{color:#72e6b5}
body{padding:20px}.card{padding:18px}.row{padding:10px 14px;margin-top:8px;line-height:1.4}.auto.selected{border-color:#00d681;background:#10372b}header{margin-bottom:14px}footer{font-size:13px}</style><main><header><div><h1>WorkBuddy 账号选择</h1><span class="muted">ZCode · Xiaomi MiMo</span></div><button id="refresh">刷新积分</button></header>
<div id="status" class="pill">正在读取 Helper…</div><p id="sync-summary" class="muted"></p><div class="card"><button id="auto" class="auto">自动轮换可用账号</button><div class="bottom muted"><span>账号</span><span>积分</span></div><div id="list"></div><div class="bottom"><span id="updated" class="muted"></span></div></div><p id="error" class="error" role="status"></p>
<footer>点击账号即可固定使用；手动指定后不会自动换到其他账号。这里控制两个客户端中「WorkBuddy 本机账号」的默认选择。客户端供应商菜单中的独立账号可以分别选择，优先于这里的默认设置。<p>积分为最近查询值，实际消费记在所用账号上。账号由 Helper 管理，每 30 秒同步。</p></footer></main>
<script nonce="__NONCE__">
const csrf='__CSRF__',list=document.getElementById('list'),error=document.getElementById('error'),auto=document.getElementById('auto'),refresh=document.getElementById('refresh');let busy=false;
const labels={ready:'可用',needs_login:'需要重新登录',disabled:'Helper 中已停用',empty:'积分不足',unavailable:'暂时无法连接',unchecked:'检查中'};
function render(s){
 const syncLabel=x=>['current','updated'].includes(x?.state)?'已同步':x?.state==='not-installed'?'未安装':'待同步';document.getElementById('sync-summary').textContent='已读取 '+s.accounts.length+' 个账号'+(s.selectorSync?' · ZCode '+syncLabel(s.selectorSync.zcode)+' · MiMo '+syncLabel(s.selectorSync.mimo)+' · DSH '+syncLabel(s.selectorSync.dsh):'');
 document.getElementById('status').textContent=s.selectedAccountId?'手动指定账号':'自动轮换';auto.classList.toggle('selected',!s.selectedAccountId);auto.setAttribute('aria-pressed',String(!s.selectedAccountId));list.replaceChildren();
 for(const a of s.accounts){const b=document.createElement('button');b.className='row'+(s.selectedAccountId===a.id?' selected':'');b.disabled=!a.enabled||a.state!=='ready';b.setAttribute('aria-pressed',String(s.selectedAccountId===a.id));const left=document.createElement('span'),name=document.createElement('span'),state=document.createElement('span'),balance=document.createElement('span');name.className='name';name.textContent=a.name;state.className='state';state.textContent=(s.selectedAccountId===a.id?'当前选用 · ':'')+(labels[a.state]||a.state);left.append(name,state);balance.className='balance';balance.textContent=typeof a.balance==='number'?Math.floor(a.balance).toLocaleString('zh-CN'):'—';b.append(left,balance);b.onclick=()=>act('/control/selection',{accountId:a.id});list.append(b);}
 document.getElementById('updated').textContent='最近同步 '+(s.lastSync?new Date(s.lastSync).toLocaleTimeString('zh-CN'):'—');if(s.sourceState!=='ready')error.textContent='Helper 账号库暂时不可读取，请检查 Helper。';
}
async function request(url,body){const r=await fetch(url,{cache:'no-store',...(body===undefined?{}:{method:'POST',headers:{'content-type':'application/json','x-csrf-token':csrf},body:JSON.stringify(body)})});const s=await r.json();if(!r.ok)throw new Error(s.error||'读取失败');render(s);}
async function act(url,body){if(busy)return;busy=true;error.textContent='';refresh.disabled=true;try{await request(url,body);}catch(e){error.textContent=e.message;}finally{busy=false;refresh.disabled=false;}}
auto.onclick=()=>act('/control/selection',{accountId:null});refresh.onclick=()=>act('/control/refresh',{});request('/control/status').catch(e=>error.textContent=e.message);setInterval(()=>{if(!busy)request('/control/status').catch(e=>error.textContent=e.message);},10000);
</script></html>
